name: Institutional Trading Bot V2.6 Pro (10m Cloud Cycle)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      analyze_coin:
        description: "Optional coin to render on-demand radar chart (BTC, ETH, SOL, XRP, XAU)"
        required: false
        default: ""
      telegram_command:
        description: "Direct command from Telegram Webhook (/status, /nightly, ACT_RISK_FREE, ACT_SAVE_50)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: institutional-trading-bot-v2-${{ github.event.inputs.telegram_command || github.event.inputs.analyze_coin || '10m-cycle' }}
  cancel-in-progress: false

jobs:
  execute-trading-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Institutional 10m Cycle (V2.6 Pro)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_ANALYZE_COIN: ${{ github.event.inputs.analyze_coin }}
          DIRECT_TELEGRAM_CMD: ${{ github.event.inputs.telegram_command }}
        run: |
          python cloud_runner.py

      - name: 5. Commit & Push Updated State Files
        run: |
          git config user.name "Institutional-Bot-V2.6"
          git config user.email "bot-v2.6@institutional-quant.local"
          git add state/*.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore(state): update V2.6 portfolio & radar [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
